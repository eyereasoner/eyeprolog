name: Publish to npm (OIDC)
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || format('{0} — {1}', github.workflow, github.ref_name) }}

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest

      - name: Run release checks
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish
