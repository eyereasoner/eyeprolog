name: Test
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || format('{0} — {1}', github.workflow, github.ref_name) }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '24']

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Run tests
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run
