name: Create GitHub Release
run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || format('{0} — {1}', github.workflow, github.ref_name) }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0


      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          MESSAGE="$(git tag -l --format='%(contents)' "$RELEASE_TAG")"
          TITLE="${MESSAGE%%$'\n'*}"

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG — $TITLE" \
            --notes "$MESSAGE" \
            --generate-notes
